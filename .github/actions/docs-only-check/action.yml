name: 'Docs-only change check'
description: >-
  変更されたファイルがすべてドキュメント系パス（documents/**, *.md,
  .github/ISSUE_TEMPLATE/**, LICENSE）に該当するかどうかを判定する。
  呼び出し側のジョブは actions/checkout を fetch-depth: 0 で
  実行しておく必要がある（base/head 双方のコミットが必要なため）。
outputs:
  docs_only:
    description: 'true if all changed files are docs-only paths, otherwise false'
    value: ${{ steps.filter.outputs.docs_only }}
runs:
  using: 'composite'
  steps:
    - id: filter
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
        else
          BASE="${{ github.event.before }}"
          HEAD="${{ github.event.after }}"
        fi

        # base/head が取れない場合は安全側に倒してフルセットのジョブを実行する
        # （docs_only=false）。
        if [ -z "$BASE" ] || [ -z "$HEAD" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
          echo "base/head SHA を判定できないため docs_only=false とします"
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # stderr はジョブログにそのまま流し、CHANGED_FILES には stdout
        # （ファイル一覧）のみを取り込む。混在させると警告出力が誤って
        # 「変更ファイル」として扱われ、docs_only 判定が壊れるため。
        if ! CHANGED_FILES=$(git diff --name-only "$BASE" "$HEAD"); then
          echo "git diff に失敗したため docs_only=false とします"
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Changed files:"
        echo "$CHANGED_FILES"

        if [ -z "$CHANGED_FILES" ]; then
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        DOCS_ONLY=true
        while IFS= read -r file; do
          [ -z "$file" ] && continue
          case "$file" in
            documents/*|*.md|.github/ISSUE_TEMPLATE/*|LICENSE)
              ;;
            *)
              DOCS_ONLY=false
              ;;
          esac
        done <<< "$CHANGED_FILES"

        echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"

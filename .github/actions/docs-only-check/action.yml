name: 'Docs-only change check'
description: >-
  変更されたファイルがすべてドキュメント系パス（*.md（documents/配下含む
  任意のディレクトリのMarkdownファイル）, .github/ISSUE_TEMPLATE/**,
  LICENSE*（LICENSE, LICENSE.txt等））に該当するかどうかを判定する。
  GitHub API（pulls/files /
  compare）でサーバー側に差分ファイル一覧を計算させるため、呼び出し側の
  actions/checkout は通常のデフォルト（shallow）設定でよく、ローカルの
  git履歴・merge-base計算には依存しない。
outputs:
  docs_only:
    description: 'true if all changed files are docs-only paths, otherwise false'
    value: ${{ steps.filter.outputs.docs_only }}
runs:
  using: 'composite'
  steps:
    - id: filter
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        bail_false() {
          echo "$1 のため docs_only=false とします"
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          exit 0
        }

        # ローカルのgit履歴に依存すると、shallow checkout環境ではPRの
        # base/headコミット間のmerge-baseを計算できない（該当コミットの
        # 親を辿れない）ことがあるため、GitHub APIにdiffの計算自体を
        # 任せる。pulls/files は元々マージベース基準（三点diff相当）で
        # 差分を返すため、mainが並行開発されていてもbase側の無関係な
        # 変更を拾わない。
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ]; then
            bail_false "PR番号を取得できない"
          fi
          if ! CHANGED_FILES=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename'); then
            bail_false "GitHub API(pulls/files)の取得に失敗した"
          fi
        else
          BASE="${{ github.event.before }}"
          HEAD="${{ github.event.after }}"
          if [ -z "$BASE" ] || [ -z "$HEAD" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            bail_false "base/head SHA を判定できない"
          fi
          # compare APIはLinkヘッダーによる継続ページングに対応していないため
          # --paginate は付けない（付けても実質no-op）。300件打ち切りに対する
          # 安全策は後段のCAPチェックで担保する。
          if ! CHANGED_FILES=$(gh api "repos/${REPO}/compare/${BASE}...${HEAD}" --jq '.files[].filename'); then
            bail_false "GitHub API(compare)の取得に失敗した"
          fi
        fi

        echo "Changed files:"
        echo "$CHANGED_FILES"

        if [ -z "$CHANGED_FILES" ]; then
          # 変更ファイルなし（no-opイベント等）はテスト対象がないため
          # docs_only=true として安全にスキップしてよい。
          # ここで早期returnすることで、直後の grep -c . が「0件マッチ」で
          # 終了コード1を返し、GitHub Actionsのbashステップがデフォルトで
          # 有効にしている errexit（bash -eo pipefail）によりステップ自体が
          # 失敗する事故を避ける（「安全側にフォールバックする」設計の
          # 意図に反して落ちてしまうバグだったため、CHANGED_FILESが
          # 非空であることが保証された後でのみ件数カウントに進む）。
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # GitHubのAPIは変更ファイル一覧を無制限には返さない:
        #   - compare API（push時）: files を最大300件で打ち切り、Linkヘッダーに
        #     よる継続ページングにも対応していない（--paginate では拾いきれない）
        #   - pulls/files API（PRイベント時）: 標準的なページングには対応して
        #     いるが、公式に3000件でハード上限が設定されている
        # 上限ちょうどに達した場合は全ファイルを把握できたと保証できないため、
        # 安全側（docs_only=false、フルセットのジョブ実行）に倒す。
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          CAP=3000
        else
          CAP=300
        fi
        # CHANGED_FILES は非空であることが保証されているが、万一すべて
        # 空行のような内容であれば grep -c . は0件マッチで終了コード1を
        # 返し、GitHub Actionsのデフォルト errexit（bash -eo pipefail）で
        # このステップごと落ちてしまう。件数カウント自体の成否は
        # docs_only判定に影響しないため、`|| true` で無害化する。
        FILE_COUNT=$(printf '%s\n' "$CHANGED_FILES" | grep -c . || true)
        if [ "$FILE_COUNT" -ge "$CAP" ]; then
          bail_false "GitHub APIの結果が上限(${CAP}件)に達し打ち切られている可能性がある"
        fi

        DOCS_ONLY=true
        while IFS= read -r file; do
          [ -z "$file" ] && continue
          case "$file" in
            *.md|.github/ISSUE_TEMPLATE/*|LICENSE*)
              ;;
            *)
              DOCS_ONLY=false
              ;;
          esac
        done <<< "$CHANGED_FILES"

        echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"

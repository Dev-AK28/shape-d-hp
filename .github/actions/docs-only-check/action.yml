name: 'Docs-only change check'
description: >-
  変更されたファイルがすべてドキュメント系パス（*.md（documents/配下含む
  任意のディレクトリのMarkdownファイル）, .github/ISSUE_TEMPLATE/**,
  LICENSE）に該当するかどうかを判定する。GitHub API（pulls/files /
  compare）でサーバー側に差分ファイル一覧を計算させるため、呼び出し側の
  actions/checkout は通常のデフォルト（shallow）設定でよく、ローカルの
  git履歴・merge-base計算には依存しない。
outputs:
  docs_only:
    description: 'true if all changed files are docs-only paths, otherwise false'
    value: ${{ steps.filter.outputs.docs_only }}
runs:
  using: 'composite'
  steps:
    - id: filter
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        bail_false() {
          echo "$1 のため docs_only=false とします"
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          exit 0
        }

        # ローカルのgit履歴に依存すると、shallow checkout環境ではPRの
        # base/headコミット間のmerge-baseを計算できない（該当コミットの
        # 親を辿れない）ことがあるため、GitHub APIにdiffの計算自体を
        # 任せる。pulls/files は元々マージベース基準（三点diff相当）で
        # 差分を返すため、mainが並行開発されていてもbase側の無関係な
        # 変更を拾わない。
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ]; then
            bail_false "PR番号を取得できない"
          fi
          if ! CHANGED_FILES=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename'); then
            bail_false "GitHub API(pulls/files)の取得に失敗した"
          fi
        else
          BASE="${{ github.event.before }}"
          HEAD="${{ github.event.after }}"
          if [ -z "$BASE" ] || [ -z "$HEAD" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            bail_false "base/head SHA を判定できない"
          fi
          if ! CHANGED_FILES=$(gh api "repos/${REPO}/compare/${BASE}...${HEAD}" --paginate --jq '.files[].filename'); then
            bail_false "GitHub API(compare)の取得に失敗した"
          fi
        fi

        echo "Changed files:"
        echo "$CHANGED_FILES"

        # GitHubのcompare API（push時に使用）は files を最大300件で打ち切り、
        # Linkヘッダーによる続きページングにも対応していない（--paginate では
        # 拾いきれない）。300件ちょうどは打ち切りの可能性があるため、
        # 全ファイルを把握できたと保証できず安全側（docs_only=false）に倒す。
        # pulls/files（PRイベント時）は標準的なページングに対応しているため
        # --paginate で全件取得できる。
        FILE_COUNT=$(printf '%s\n' "$CHANGED_FILES" | grep -c .)
        if [ "${{ github.event_name }}" != "pull_request" ] && [ "$FILE_COUNT" -ge 300 ]; then
          bail_false "compare APIの結果が300件に達し打ち切られている可能性がある"
        fi

        if [ -z "$CHANGED_FILES" ]; then
          # 変更ファイルなし（no-opイベント等）はテスト対象がないため
          # docs_only=true として安全にスキップしてよい。
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        DOCS_ONLY=true
        while IFS= read -r file; do
          [ -z "$file" ] && continue
          case "$file" in
            *.md|.github/ISSUE_TEMPLATE/*|LICENSE)
              ;;
            *)
              DOCS_ONLY=false
              ;;
          esac
        done <<< "$CHANGED_FILES"

        echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
